<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Переход...</title>
    <script type="text/javascript">
      // GitHub Pages отдаёт этот файл (404.html) при запросе любого несуществующего
      // файла. Так как приложение работает на HashRouter, корректный адрес любой
      // страницы начинается с "#/". Здесь мы вытаскиваем путь, введённый
      // пользователем (внутри "/collectibles-shop/..."), и переносим его в хэш,
      // чтобы после обновления страницы открывался тот же экран, а не 404.
      (function () {
        var location = window.location;
        var base = '/collectibles-shop/';
        var current = location.pathname;
        var rest = '';

        // Убираем из пути всё, что идёт до префикса приложения.
        if (current.indexOf(base) === 0) {
          rest = current.slice(base.length);
        } else {
          rest = current.replace(/^\//, '');
        }

        // Убираем ведущий "/" у внутренней части.
        rest = rest.replace(/^\//, '');

        // Корневой запрос (сам сайт) -> главная страница.
        if (!rest || rest === 'index.html') {
          location.href = base + '#/';
          return;
        }

        // Остальные пути -> соответствующий экран внутри приложения.
        location.href = base + '#/' + rest + location.search;
      })();
    </script>
  </head>
  <body>
  </body>
</html>
